[package]
name = "zaen-db"
version = "1.0.0"
edition = "2021"
description = "Read-only SQLite maintenance and verification toolkit for Ask Zaen"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

