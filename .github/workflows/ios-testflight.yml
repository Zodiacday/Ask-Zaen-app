name: Deploy Ask Zaen to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (leave blank to use the GitHub run number)
        required: false
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

env:
  BUNDLE_IDENTIFIER: com.asterius.askzaen
  APPLE_TEAM_ID: RRS43X8SMU
  APP_VERSION: 1.0.0
  SCHEME: AskZaen

jobs:
  testflight-deploy:
    name: Build and deploy Ask Zaen to TestFlight
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Print Apple toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --non-interactive

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-askzaen-swiftpm-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-askzaen-swiftpm-

      - name: Resolve Swift packages
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_HTTP_VERSION: HTTP/1.1
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SPM_DIR="$HOME/Library/Developer/Xcode/SourcePackages"
          mkdir -p "$SPM_DIR"
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SPM_DIR=$SPM_DIR" >> "$GITHUB_ENV"

          git ls-remote --exit-code https://github.com/clerk/clerk-ios.git HEAD
          git ls-remote --exit-code https://github.com/kean/Nuke.git HEAD

          xcodebuild -resolvePackageDependencies \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_DIR"

      - name: Install Apple distribution certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'askzaen-ci-keychain' }}
        run: |
          test -n "$BUILD_CERTIFICATE_BASE64" || { echo 'Missing BUILD_CERTIFICATE_BASE64'; exit 1; }
          test -n "$P12_PASSWORD" || { echo 'Missing P12_PASSWORD'; exit 1; }
          test -n "$BUILD_PROVISION_PROFILE_BASE64" || { echo 'Missing BUILD_PROVISION_PROFILE_BASE64'; exit 1; }

          KEYCHAIN_PATH="$RUNNER_TEMP/askzaen-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/askzaen-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/askzaen-appstore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/askzaen-profile.plist"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_PLIST=$PROFILE_PLIST" >> "$GITHUB_ENV"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")

          test "$PROFILE_APP_ID" = "$APPLE_TEAM_ID.$BUNDLE_IDENTIFIER" || {
            echo "Provisioning profile application identifier is $PROFILE_APP_ID, expected $APPLE_TEAM_ID.$BUNDLE_IDENTIFIER"
            exit 1
          }

          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Configure manual Xcode signing
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          bundle_identifier = os.environ['BUNDLE_IDENTIFIER']
          team_id = os.environ['APPLE_TEAM_ID']
          profile_name = os.environ['PROFILE_NAME']
          project_file = next(Path('ios').glob('*.xcodeproj/project.pbxproj'))
          source = project_file.read_text()
          marker = f'PRODUCT_BUNDLE_IDENTIFIER = {bundle_identifier};'

          if not profile_name or '"' in profile_name or '\n' in profile_name:
              raise SystemExit('Provisioning profile name contains unsupported characters')
          if marker not in source:
              raise SystemExit(f'Could not find {marker} in {project_file}')

          signing_settings = (
              f'\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";'
              f'\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
              f'\n\t\t\t\tDEVELOPMENT_TEAM = {team_id};'
              f'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_name}";'
          )
          updated = source.replace(marker, marker + signing_settings)
          project_file.write_text(updated)
          print(f'Configured manual signing in {project_file} ({updated.count(signing_settings)} configurations)')
          PY

      - name: Determine build number
        id: build_num
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            echo "number=${{ github.event.inputs.build_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive the signed application
        run: |
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AskZaen.xcarchive" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -disableAutomaticPackageResolution \
            CURRENT_PROJECT_VERSION="${{ steps.build_num.outputs.number }}" \
            MARKETING_VERSION="$APP_VERSION" \
            archive

      - name: Export the signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_IDENTIFIER}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AskZaen.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/AskZaenExport"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: askzaen-ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/AskZaenExport/*.ipa
          retention-days: 14

      - name: Upload IPA to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          test -n "$ASC_KEY_ID" || { echo 'Missing ASC_KEY_ID'; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo 'Missing ASC_ISSUER_ID'; exit 1; }
          test -n "$ASC_PRIVATE_KEY" || { echo 'Missing ASC_PRIVATE_KEY'; exit 1; }

          mkdir -p "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"

          ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          IPA=$(find "$RUNNER_TEMP/AskZaenExport" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Clean signing materials
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "${CERTIFICATE_PATH:-}" "${PROFILE_PATH:-}" "${PROFILE_PLIST:-}" "${RUNNER_TEMP}/askzaen-profile.plist"
          rm -f "$HOME/.private_keys/AuthKey_${ASC_KEY_ID:-}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID:-}.p8"
